<h1>承認依頼アドイン</h1>
<p>Outlook のメール作成画面で「承認依頼」を押すと、本文の先頭に承認／却下ボタンを差し込みます。To の宛先が承認者になります。</p>
<p>承認者がボタンを押すと、依頼者宛ての回答メールが作成されます。</p>
